<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>amelie@cloudmile — last login</title>
<meta name="description" content="掃到了就進來打個名字吧。">
<meta name="theme-color" content="#07100b">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
  :root{
    --bg:#07100b; --fg:#6bf79a; --dim:#4aa471; --warn:#ffd166; --err:#ff6b6b;
    --glow:0 0 3px rgba(91,240,138,.26);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--mono);
    font-size:clamp(16px,4.3vw,18px); line-height:1.78; letter-spacing:.3px;
    text-shadow:var(--glow); overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  /* CRT 掃描線 + 暈影 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.10) 3px 6px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:10;
    background:radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.38) 100%);
  }
  #screen{
    position:relative; z-index:1; min-height:100%;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width:760px; margin:0 auto;
    animation:flicker 7s infinite steps(1);
  }
  @keyframes flicker{0%,97%{opacity:1}97.5%{opacity:.86}98%{opacity:1}98.5%{opacity:.92}99%{opacity:1}}
  @media (prefers-reduced-motion:reduce){#screen{animation:none}body::before{display:none}}

  pre{margin:0; white-space:pre-wrap; word-break:break-word; font:inherit}
  .banner{color:var(--fg); font-size:clamp(9px,3.1vw,13px); line-height:1.25; margin-bottom:10px; opacity:.95}
  .dim{color:var(--dim)}
  .warn{color:var(--warn); text-shadow:0 0 6px rgba(255,209,102,.4)}
  .err{color:var(--err); text-shadow:0 0 6px rgba(255,107,107,.4)}
  .card{
    border-left:2px solid var(--dim); padding:4px 0 4px 14px; margin:6px 0 2px;
    color:#c9ffdd; text-shadow:none;
    font-size:1.06em; line-height:1.85; letter-spacing:.4px;
  }
  .ps1{color:var(--dim)}
  .ps1 b{color:var(--fg); font-weight:400}

  /* 輸入列 */
  #inputline{display:flex; align-items:baseline; gap:8px; margin-top:12px}
  #inputline.hide{display:none}
  #ps{white-space:nowrap; color:var(--dim)}
  #ps b{color:var(--fg); font-weight:400}
  #cmd{
    flex:1 1 auto; min-width:0;
    background:transparent; border:0; outline:0; padding:0;
    color:var(--fg); font:inherit; letter-spacing:inherit;
    text-shadow:var(--glow); caret-color:transparent;
  }
  #cmd::placeholder{color:#1f5636; text-shadow:none}
  #caret{
    display:inline-block; width:.62em; height:1.05em; background:var(--fg);
    box-shadow:var(--glow); vertical-align:-.18em; margin-left:-4px;
    animation:blink 1.05s steps(1) infinite;
  }
  #caret.off{opacity:.25; animation:none}
  @keyframes blink{50%{opacity:0}}

  .hint{margin-top:18px; color:var(--dim); font-size:.92em; line-height:1.75}
  .hint kbd{
    border:1px solid var(--dim); border-radius:3px; padding:0 4px; font:inherit; font-size:.95em;
  }
  #px{
    position:fixed; inset:0; z-index:20; width:100%; height:100%;
    display:none; background:#14162a;
    image-rendering:pixelated; image-rendering:crisp-edges;
    transition:opacity .32s linear;
  }
  #px.on{display:block}
  #pxtitle{
    position:fixed; inset:0; z-index:21; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;
    pointer-events:none; text-align:center; padding:0 18px;
  }
  /* 暗帶只包住文字本身，太陽與天空維持原亮度 */
  #pxtitle .band{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:20px 10% 22px;
    background:linear-gradient(90deg,
      rgba(10,12,26,0) 0%, rgba(10,12,26,.80) 14%,
      rgba(10,12,26,.80) 86%, rgba(10,12,26,0) 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 80%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 80%,transparent 100%);
  }
  #pxtitle.on{display:flex}
  #pxtitle .t{
    font-family:var(--mono); font-weight:700;
    font-size:clamp(38px,13vw,84px); letter-spacing:.3em; text-indent:.3em;
    color:#f8e8cb;
    text-shadow:3px 3px 0 rgba(10,12,26,.95), -2px 0 0 rgba(10,12,26,.8), 0 -2px 0 rgba(10,12,26,.8),
                2px 0 0 rgba(10,12,26,.8), 0 2px 0 rgba(10,12,26,.8), 0 0 22px rgba(242,214,173,.30);
    opacity:0;
  }
  #pxtitle .sub{
    font-family:var(--mono); font-size:clamp(13px,3.6vw,18px); letter-spacing:.42em; text-indent:.42em;
    color:#f2d6ad; opacity:0; text-shadow:2px 2px 0 rgba(16,18,36,.92);
  }
  #pxtitle .show{ animation:popin .28s steps(3) forwards; }
  @keyframes popin{ from{opacity:0; transform:translateY(6px) scale(.96)} to{opacity:1; transform:none} }
  #pxhint{
    position:fixed; z-index:21; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom));
    text-align:center; color:#f2d6ad; opacity:.55; font-size:11px; letter-spacing:2px;
    text-shadow:none; display:none;
  }
  #pxhint.on{display:block}
  #skip{
    position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:12;
    background:rgba(7,16,11,.9); border:1px solid var(--dim); color:var(--dim);
    font:inherit; font-size:12px; padding:8px 12px; border-radius:4px; display:none;
  }
  #skip.show{display:block}
</style>
</head>
<body>
<div id="screen" role="main">
  <pre class="banner" aria-hidden="true">┌──────────────────────────────────────┐
│  A M E L I E . L E E                 │
│  last login: 2026-11-06  (final)     │
└──────────────────────────────────────┘</pre>
  <pre id="out" aria-live="polite"></pre>

  <div id="inputline" class="hide">
    <span id="ps"><b>amelie@cloudmile</b><span class="dim">:~$</span></span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="go" inputmode="text" aria-label="輸入指令">
    <span id="caret"></span>
  </div>

  <div class="hint" id="hint" hidden>
    想玩的話可以輸入 <kbd>help</kbd>。
  </div>
</div>
<canvas id="px" aria-hidden="true"></canvas>
<div id="pxtitle"><div class="band"><div class="t"></div><div class="sub"></div></div></div>
<div id="pxhint">TAP TO SKIP</div>
<button id="skip" type="button">跳過動畫 ▸▸</button>

<script src="pixel-intro.js"></script>
<script>
(function(){
  "use strict";
  var out = document.getElementById('out');
  var line = document.getElementById('inputline');
  var cmd = document.getElementById('cmd');
  var hint = document.getElementById('hint');
  var skipBtn = document.getElementById('skip');
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ================= 輸出引擎 ================= */
  var queue = [], running = false, skipping = false;
  function scroll(){ window.scrollTo(0, document.body.scrollHeight); }
  function push(op){ queue.push(op); if(!running) run(); }
  function say(t, cls, sp){ push({k:'type', text:String(t), cls:cls||'', speed:sp||20}); }
  function print(t, cls){ push({k:'print', text:String(t), cls:cls||''}); }
  function wait(ms){ push({k:'wait', ms:ms}); }
  function then(fn){ push({k:'fn', fn:fn}); }

  function run(){
    running = true;
    var op = queue.shift();
    if(!op){ running = false; skipping = false; skipBtn.classList.remove('show'); return; }
    if(op.k === 'fn'){ op.fn(); return run(); }
    if(op.k === 'wait'){ return (skipping || reduce) ? run() : void setTimeout(run, op.ms); }
    var span = document.createElement('span');
    if(op.cls) span.className = op.cls;
    out.appendChild(span);
    var tail = document.createTextNode('\n');
    if(op.k === 'print' || skipping || reduce){
      span.textContent = op.text; out.appendChild(tail); scroll(); return run();
    }
    skipBtn.classList.add('show');
    var i = 0, chars = Array.from(op.text);
    (function tick(){
      if(skipping){ span.textContent = op.text; out.appendChild(tail); scroll(); return run(); }
      span.textContent += chars[i++];
      if(i >= chars.length){ out.appendChild(tail); scroll(); return run(); }
      var c = chars[i-1];
      scroll();
      setTimeout(tick, /[。，、！？\.,!?]/.test(c) ? op.speed * 7 : op.speed);
    })();
  }
  function doSkip(){ if(running) skipping = true; }
  skipBtn.addEventListener('click', doSkip);

  /* ================= 解密 ================= */
  var te = new TextEncoder(), td = new TextDecoder();
  function b64uToBytes(s){
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function hex(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){
      return ('0'+b.toString(16)).slice(-2);
    }).join('');
  }
  async function sha256(str){ return crypto.subtle.digest('SHA-256', te.encode(str)); }

  async function unlock(token){
    var res = await fetch('cards.enc.json', {cache:'no-store'});
    if(!res.ok) throw new Error('payload ' + res.status);
    var data = await res.json();
    var id = hex(await sha256('id:' + token)).slice(0, 16);
    var e = data.entries[id];
    if(!e) return null;
    var key = await crypto.subtle.importKey('raw', await sha256('key:' + token), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64uToBytes(e.iv)}, key, b64uToBytes(e.ct));
    return JSON.parse(td.decode(pt));
  }
  async function getFallback(){
    try { return await (await fetch('fallback.json', {cache:'no-store'})).json(); }
    catch(_) { return { name:'unknown', msg:'這個連結沒有對應到任何人。' }; }
  }

  /* ================= 卡片 ================= */
  function showCard(card, opts){
    opts = opts || {};
    var file = (card.name || 'unknown').toLowerCase().replace(/[^a-z0-9]/g,'') || 'unknown';
    print('');
    say('$ cat farewell/' + file + '.txt', 'ps1', 22);
    wait(420);
    String(card.msg || '').split('\n').forEach(function(l){
      if(l === '') print(''); else say(l, 'card', 27);
    });
    wait(500);
    print('');
    print('— amelie', 'dim');
    if(!opts.quiet){
      print('');
      say('（這張卡只有你打得開。）', 'dim', 16);
    }
    prompt();
  }

  /* ================= 指令彩蛋 ================= */
  var COMMANDS = {
    help: function(){
      print('');
      print('可用指令：', 'dim');
      ['  again      再放一次你的卡片',
       '  ls         看看 farewell/ 裡有什麼',
       '  whoami     ？',
       '  clear      清螢幕',
       '  credits    這東西是誰做的',
       '  （還有幾個沒寫在這，自己試）'].forEach(function(l){ print(l, 'dim'); });
      prompt();
    },
    again: function(){ if(window.__card) showCard(window.__card, {quiet:true}); else { print(''); print('沒有可以重播的卡片。','dim'); prompt(); } },
    ls: function(){
      print('');
      print('farewell/', 'dim');
      print('  16 files, 0 regrets', 'dim');
      print('  （其他 15 個你打不開，那是別人的。）', 'dim');
      prompt();
    },
    whoami: function(){
      print('');
      say('你是一個願意掃陌生 QR code 的人。這很危險，但我很感謝。', 'warn', 26);
      prompt();
    },
    clear: function(){ out.textContent = ''; prompt(); },
    credits: function(){
      print('');
      ['built in one night with Claude Code',
       'by amelie, on her last day',
       'stack: 一個 html、一包 AES-GCM、零個後端'].forEach(function(l){ print(l, 'dim'); });
      prompt();
    },
    exit: function(){
      print('');
      say('logout', 'dim', 20); wait(400);
      say('Connection to cloudmile closed.', 'dim', 22); wait(700);
      print('');
      say('…騙你的。關掉分頁才算數。', 'warn', 26);
      prompt();
    },
    sudo: function(){
      print('');
      print('amelie is not in the sudoers file.', 'err');
      print('This incident has been reported.（報給誰？我已經離職了。）', 'err');
      prompt();
    },
    rm: function(raw){
      print('');
      if(/-rf?\b/.test(raw)){
        say('rm: 正在刪除 /…', 'err', 30); wait(800);
        print('rm: 開玩笑的。這裡沒有東西可以刪，只有話可以說。', 'warn');
      } else print('rm: 這台機器唯讀。', 'dim');
      prompt();
    },
    cat: function(){ print(''); print('cat: 你只有一張卡的讀取權限。試試 again。', 'dim'); prompt(); }
  };

  function handle(raw){
    var input = String(raw).trim();
    if(!input) return prompt();
    var head = input.split(/\s+/)[0].toLowerCase();
    if(COMMANDS[head]) return COMMANDS[head](input);
    print('');
    print('command not found: ' + head, 'err');
    print('輸入 help 看看有什麼。', 'dim');
    prompt();
  }

  /* ================= 輸入列 ================= */
  function prompt(){
    then(function(){
      line.classList.remove('hide');
      hint.hidden = false;
      cmd.value = '';
      cmd.placeholder = 'help';
      setTimeout(scroll, 0);
    });
  }
  cmd.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(running) return doSkip();
    var v = cmd.value;
    print('');
    print('amelie@cloudmile:~$ ' + v, 'ps1');
    line.classList.add('hide'); hint.hidden = true; cmd.blur();
    handle(v);
  });
  document.addEventListener('click', function(e){
    if(e.target === skipBtn) return;
    if(running) return doSkip();
    if(!line.classList.contains('hide')) cmd.focus();
  });


  /* ================= 像素過場 ================= */
  function playIntro(){
    var cv = document.getElementById('px');
    var pxhint = document.getElementById('pxhint');
    if(reduce || !cv || !cv.getContext || !global_PixelIntro()){
      return Promise.resolve();
    }
    var PI = global_PixelIntro();
    var ctx2d = cv.getContext('2d', { alpha:false });

    // 低解析度內部畫布 → CSS 放大成大顆像素
    var W = 132;
    var H = Math.max(120, Math.min(300, Math.round(W * (innerHeight / innerWidth))));
    cv.width = W; cv.height = H;
    var img = ctx2d.createImageData(W, H);

    var tt = document.getElementById('pxtitle');
    var ttMain = tt.querySelector('.t'), ttSub = tt.querySelector('.sub');

    cv.classList.add('on');
    setTimeout(function(){ pxhint.classList.add('on'); }, 900);

    // 時間軸（毫秒）：掃描線拉開 → 撥雲見日 → 滿版字幕 → 碎解
    var T_WIPE = 800, T_SUN = 1500, T_TITLE = 2700, T_BREAK = 800, T_FADE = 320;
    var TOTAL = T_WIPE + T_SUN + T_TITLE + T_BREAK;

    // 滿版字幕：一段一句，最後一句是梗
    var TITLES = [
      { t:'豔陽高照', sub:'' },
      { t:'撥雲見日．．', sub:'' },
      { t:'萬里無雲', sub:'萬里雲，再見' }
    ];
    var shownBeat = -1;
    function beat(i){
      if(i === shownBeat) return;
      shownBeat = i;
      if(i < 0 || i >= TITLES.length){ tt.classList.remove('on'); return; }
      var b = TITLES[i];
      tt.classList.add('on');
      ttMain.classList.remove('show'); ttSub.classList.remove('show');
      void ttMain.offsetWidth;                       // 重啟動畫
      ttMain.textContent = b.t;
      ttSub.textContent = b.sub;
      ttMain.classList.add('show');
      if(b.sub) setTimeout(function(){ ttSub.classList.add('show'); }, 420);
    }

    return new Promise(function(resolve){
      var start = performance.now(), done = false, raf = 0;

      function finish(){
        if(done) return; done = true;
        cancelAnimationFrame(raf);
        document.removeEventListener('pointerdown', onTap, true);
        pxhint.classList.remove('on');
        tt.classList.remove('on');
        cv.style.opacity = '0';
        setTimeout(function(){ cv.classList.remove('on'); resolve(); }, T_FADE);
      }
      function onTap(){ finish(); }
      document.addEventListener('pointerdown', onTap, true);

      function frame(now){
        var e = now - start;
        var p = { t:0, reveal:0, dissolve:0, tint:0 };
        if(e < T_WIPE){
          var w = e / T_WIPE;
          p.reveal = w * w * (3 - 2 * w);           // smoothstep，像掃描線拉下來
          p.t = 0.18 * w;
        } else if(e < T_WIPE + T_SUN){
          var s = (e - T_WIPE) / T_SUN;
          p.reveal = 1; p.t = 0.18 + 0.82 * s;
        } else if(e < T_WIPE + T_SUN + T_TITLE){
          // 畫面定格在豔陽，字幕一句一句打出來
          p.reveal = 1; p.t = 1;
          beat(Math.min(TITLES.length - 1,
                        Math.floor((e - T_WIPE - T_SUN) / (T_TITLE / TITLES.length))));
        } else {
          var b2 = Math.min(1, (e - T_WIPE - T_SUN - T_TITLE) / T_BREAK);
          p.reveal = 1; p.t = 1; p.dissolve = b2; p.tint = Math.min(1, b2 * 1.25);
          if(b2 > 0.45) beat(-1);
        }
        PI.renderFrame(img, W, H, p);
        ctx2d.putImageData(img, 0, 0);
        if(e >= TOTAL) return finish();
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    });
  }
  function global_PixelIntro(){
    return (typeof PixelIntro !== 'undefined') ? PixelIntro : null;
  }

  /* ================= 開機 ================= */
  var token = (location.hash || '').replace(/^#/, '').trim();

  function boot(card){
    say('$ ssh amelie@cloudmile --final', 'ps1', 18); wait(260);
    print('Authenticating with card key… ok', 'dim'); wait(200);
    print('Mounting /farewell … ok', 'dim'); wait(320);
    print('');
    say('嗨嗨，今天我就要離職了～', '', 32); wait(420);
    say('為感謝你在這段時間的協助，我寫了卡片給你', '', 32); wait(520);
    print('');
    say('$ whoami', 'ps1', 24); wait(380);
    say('> ' + (card.name || 'unknown'), '', 60); wait(500);
    then(function(){ showCard(card); });
  }

  (async function start(){
    // 過場動畫與抓取解密同時進行 —— 動畫剛好蓋住真實等待時間
    var pending = token ? unlock(token).catch(function(e){ console.error(e); return null; })
                        : Promise.resolve(null);
    var results = await Promise.all([playIntro(), pending]);
    var card = results[1];
    if(!card){
      var fb = await getFallback();
      say('$ ssh amelie@cloudmile --final', 'ps1', 18); wait(260);
      print('Authenticating with card key… failed', 'err'); wait(400);
      print('');
      then(function(){ showCard(fb, {quiet:true}); });
      return;
    }
    window.__card = card;
    boot(card);
  })();
})();

</script>
</body>
</html>
