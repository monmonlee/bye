<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>amelie@cloudmile — last login</title>
<meta name="description" content="掃到了就進來打個名字吧。">
<meta name="theme-color" content="#07100b">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
  :root{
    --bg:#07100b; --fg:#6bf79a; --dim:#4aa471; --warn:#ffd166; --err:#ff6b6b;
    --glow:0 0 3px rgba(91,240,138,.26);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--mono);
    font-size:clamp(15.5px,4.1vw,17px); line-height:1.78; letter-spacing:.3px;
    text-shadow:var(--glow); overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  /* CRT 掃描線 + 暈影 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.10) 3px 6px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:10;
    background:radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.38) 100%);
  }
  #screen{
    position:relative; z-index:1; min-height:100%;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(32vh + env(safe-area-inset-bottom));
    max-width:760px; margin:0 auto;
    animation:flicker 7s infinite steps(1);
  }
  @keyframes flicker{0%,97%{opacity:1}97.5%{opacity:.86}98%{opacity:1}98.5%{opacity:.92}99%{opacity:1}}
  @media (prefers-reduced-motion:reduce){#screen{animation:none}body::before{display:none}}

  pre{margin:0; white-space:pre-wrap; word-break:break-word; font:inherit}
  .banner{color:var(--fg); font-size:clamp(9px,3.1vw,13px); line-height:1.25; margin-bottom:10px; opacity:.95}
  .dim{color:var(--dim)}
  .warn{color:var(--warn); text-shadow:0 0 6px rgba(255,209,102,.4)}
  .err{color:var(--err); text-shadow:0 0 6px rgba(255,107,107,.4)}
  .to{
    font-family:"Press Start 2P", var(--mono);   /* 像素字；名字都是英文，字檔很小 */
    color:#d8ffe8; text-shadow:0 0 12px rgba(107,247,154,.40);
    font-size:1.3em; letter-spacing:.06em; line-height:1.5;
    display:inline-block; padding:6px 0 8px;
  }
  .rise{ animation:rise .5s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ .rise{animation:none} }
  .card{
    display:block;                      /* 關鍵：折行後才會保留縮排與左線 */
    border-left:2px solid var(--dim); padding:0 0 0 14px;
    color:#c9ffdd; text-shadow:none;
    font-size:1.04em; line-height:1.85; letter-spacing:.3px;
  }
  .ps1{color:var(--dim)}
  .ps1 b{color:var(--fg); font-weight:400}

  /* 輸入列 */
  #inputline{display:flex; align-items:baseline; gap:8px; margin-top:12px}
  #inputline.hide{display:none}
  #inputline.await{
    border:1px solid var(--dim); border-radius:4px;
    padding:10px 12px; margin-top:16px;
    box-shadow:0 0 0 3px rgba(74,164,113,.08);
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{box-shadow:0 0 0 6px rgba(74,164,113,.14)}}
  @media (prefers-reduced-motion:reduce){ #inputline.await{animation:none} }
  #ps{white-space:nowrap; color:var(--dim)}
  #ps b{color:var(--fg); font-weight:400}
  #cmd{
    flex:1 1 auto; min-width:0;
    background:transparent; border:0; outline:0; padding:0;
    color:var(--fg); font:inherit; letter-spacing:inherit;
    text-shadow:var(--glow); caret-color:transparent;
  }
  #cmd::placeholder{color:#1f5636; text-shadow:none}
  #caret{
    display:inline-block; width:.62em; height:1.05em; background:var(--fg);
    box-shadow:var(--glow); vertical-align:-.18em; margin-left:-4px;
    animation:blink 1.05s steps(1) infinite;
  }
  #caret.off{opacity:.25; animation:none}
  @keyframes blink{50%{opacity:0}}

  .sprites{
    display:block; margin:20px 0 6px; max-width:100%; height:auto;
    image-rendering:pixelated;
  }
  .lace{
    display:block; width:100%; height:auto; margin:14px 0;
    image-rendering:pixelated; opacity:.85;
  }
  #out a{ color:#8ff7b8; text-decoration:underline; text-underline-offset:3px; text-decoration-style:dotted; }
  #out a:active{ opacity:.6 }
  .hint{margin-top:18px; color:var(--dim); font-size:.92em; line-height:1.75}
  .hint kbd{
    border:1px solid var(--dim); border-radius:3px; padding:0 4px; font:inherit; font-size:.95em;
  }
  #px{
    position:fixed; inset:0; z-index:20; width:100%; height:100%;
    display:none; background:#14162a;
    image-rendering:pixelated; image-rendering:crisp-edges;
    transition:opacity .32s linear;
  }
  #px.on{display:block}
  #pxhint{
    position:fixed; z-index:21; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom));
    text-align:center; color:#f2d6ad; opacity:.55; font-size:11px; letter-spacing:2px;
    text-shadow:none; display:none;
  }
  #pxhint.on{display:block}
</style>
</head>
<body>
<div id="screen" role="main">
  <pre class="banner" aria-hidden="true">┌──────────────────────────────────────┐
│  A M E L I E . L E E                 │
│  last login: 2026-11-06  (final)     │
└──────────────────────────────────────┘</pre>
  <pre id="out" aria-live="off"></pre>
  <div id="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>

  <div id="inputline" class="hide">
    <span id="ps"><b>amelie@cloudmile</b><span class="dim">:~$</span></span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="go" inputmode="text" aria-label="輸入指令">
    <span id="caret"></span>
  </div>

  <div class="hint" id="hint" hidden>
    想再看一次輸入 <kbd>card</kbd>，想玩輸入 <kbd>help</kbd>。
  </div>
</div>
<canvas id="px" aria-hidden="true"></canvas>
<div id="pxhint">TAP TO SKIP</div>

<script src="sprites.js"></script>
<script src="pixel-intro.js"></script>
<script>
(function(){
  "use strict";
  var out = document.getElementById('out');
  var line = document.getElementById('inputline');
  var cmd = document.getElementById('cmd');
  var hint = document.getElementById('hint');
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ================= 輸出引擎 ================= */
  var queue = [], running = false, skipping = false;
  var userScrolled = false;
  addEventListener('scroll', function(){
    // 離底部超過 120px＝使用者想自己讀，暫停自動捲動
    var gap = document.body.scrollHeight - (scrollY + innerHeight);
    userScrolled = gap > 120;
  }, { passive:true });
  var holdTop = false;              // 卡片剛展開時，停在開頭不要往下衝
  function scroll(){ if(!userScrolled && !holdTop) window.scrollTo(0, document.body.scrollHeight); }
  function push(op){ queue.push(op); if(!running) run(); }
  function say(t, cls, sp){ push({k:'type', text:String(t), cls:cls||'', speed:sp||20}); }
  function reveal(t, cls, hold){ push({k:'line', text:String(t), cls:cls||'', hold:hold||420}); }
  function link(t, href, cls){ push({k:'link', text:String(t), href:href, cls:cls||''}); }
  function print(t, cls){ push({k:'print', text:String(t), cls:cls||''}); }
  function wait(ms){ push({k:'wait', ms:ms}); }
  function then(fn){ push({k:'fn', fn:fn}); }

  function run(){
    running = true;
    var op = queue.shift();
    if(!op){ running = false; skipping = false; return; }
    if(op.k === 'fn'){ op.fn(); return run(); }
    if(op.k === 'wait'){ return (skipping || reduce) ? run() : void setTimeout(run, op.ms); }
    var span = document.createElement('span');
    if(op.cls) span.className = op.cls;
    out.appendChild(span);
    var isBlock = /\bcard\b/.test(op.cls);
    var tail = document.createTextNode(isBlock ? '' : '\n');
    if(op.k === 'link'){
      var a = document.createElement('a');
      a.href = op.href; a.textContent = op.text;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      if(op.cls) a.className = op.cls;
      out.appendChild(a); out.appendChild(document.createTextNode('\n'));
      scroll(); return run();
    }
    if(op.k === 'line'){
      span.textContent = op.text;
      if(!skipping && !reduce) span.classList.add('rise');
      out.appendChild(tail); scroll();
      return (skipping || reduce) ? run() : void setTimeout(run, op.hold);
    }
    if(op.k === 'print' || skipping || reduce){
      span.textContent = op.text; out.appendChild(tail); scroll(); return run();
    }
    var i = 0, chars = Array.from(op.text);
    (function tick(){
      if(skipping){ span.textContent = op.text; out.appendChild(tail); scroll(); return run(); }
      span.textContent += chars[i++];
      if(i >= chars.length){ out.appendChild(tail); scroll(); return run(); }
      var c = chars[i-1];
      scroll();
      setTimeout(tick, /[。，、！？\.,!?]/.test(c) ? op.speed * 7 : op.speed);
    })();
  }
  function doSkip(){ if(running) skipping = true; }

  /* ================= 解密 ================= */
  var te = new TextEncoder(), td = new TextDecoder();
  function b64uToBytes(s){
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function hex(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){
      return ('0'+b.toString(16)).slice(-2);
    }).join('');
  }
  async function sha256(str){ return crypto.subtle.digest('SHA-256', te.encode(str)); }

  // 載入與解密分開：載不到是「連線問題」，解不開才是「不在名單」
  async function loadPayload(){
    var res = await fetch('cards.enc.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function unlock(data, token){
    var id = hex(await sha256('id:' + token)).slice(0, 16);
    var e = data.entries[id];
    if(!e) return null;
    try {
      var key = await crypto.subtle.importKey('raw', await sha256('key:' + token), 'AES-GCM', false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64uToBytes(e.iv)}, key, b64uToBytes(e.ct));
      return JSON.parse(td.decode(pt));
    } catch(_) { return null; }        // 金鑰不對 ＝ 不在名單，不是連線問題
  }
  async function getFallback(){
    try { return await (await fetch('fallback.json', {cache:'no-store'})).json(); }
    catch(_) { return { name:'unknown', msg:'這個連結沒有對應到任何人。' }; }
  }

  /* ================= 卡片 ================= */
  function showCard(card, opts){
    opts = opts || {};
    var file = (card.name || 'unknown').toLowerCase().replace(/[^a-z0-9]/g,'') || 'unknown';
    print('');
    var anchor = null;
    then(function(){                              // 卡片起點的錨
      anchor = document.createElement('span');
      out.appendChild(anchor);
    });
    print('$ cat farewell/' + file + '.txt', 'ps1');
    then(addLace);
    String(card.msg || '').split('\n').forEach(function(l){
      print(l, l === '' ? '' : 'card');        // 全文一次印出，不做動畫
    });
    then(function(){                               // 印完回到卡片開頭，從上往下讀
      if(!anchor) return;
      var y = anchor.getBoundingClientRect().top + (window.scrollY || 0) - 12;
      holdTop = true;
      window.scrollTo(0, Math.max(0, y));
    });
    then(function(){                               // 讀螢幕軟體一次讀完整段，不逐字念
      var sr = document.getElementById('sr');
      if(sr) sr.textContent = String(card.msg || '');
    });
    // 文案自己有署名（by ...）就不要再加一行「— amelie」
    if(!/(^|\n)\s*by\s+\S/i.test(String(card.msg || ''))){
      print('');
      print('— amelie', 'dim');
    }
    if(!opts.quiet){
      print('');
      print('（這張卡只有你打得開。）', 'dim');
    }
    then(addLace);
    then(function(){ addSprites(card); });
    prompt();
  }

  // 每封信結尾長出幾隻小動物。專屬的那隻固定出現，其餘從場景組隨機抽
  var OWN = { Clara:'熊貓', Iris:'守宮', Amber:'烏龜', Amelia:'兔子', Jimmy:'王冠' };
  function addLace(){
    if(!window.drawLace) return;
    var cv = document.createElement('canvas');
    cv.className = 'lace';
    cv.setAttribute('aria-hidden','true');
    drawLace(cv, '菱形', 130);
    out.appendChild(cv);
    out.appendChild(document.createTextNode('\n'));
  }

  function addSprites(card){
    if(!window.SPRITES || !window.drawSpriteRow) return;
    var name = card && card.name || '';
    var rnd = spriteSeed(name || 'amelie');
    var pool = Object.keys(SPRITES.scene).filter(function(k){ return k !== '鳥_飛'; });
    var pick = [];
    if(OWN[name]) pick.push(OWN[name]);
    if(name === 'Amber') pick.push('小烏龜', '小烏龜');          // 彭彭、丁滿、妹妹
    while(pick.length < 3){
      var c = pool[Math.floor(rnd() * pool.length)];
      if(pick.indexOf(c) < 0) pick.push(c);
    }
    var cv = document.createElement('canvas');
    cv.className = 'sprites';
    cv.setAttribute('aria-hidden','true');
    drawSpriteRow(cv, pick);
    cv.style.width = (cv.width * 5) + 'px';      // 固定 5 倍，每張卡的像素大小才一致
    out.appendChild(cv);
    out.appendChild(document.createTextNode('\n'));
    scroll();
  }

  /* ================= 指令彩蛋 ================= */
  var COMMANDS = {
    help: function(){
      print('');
      print('可用指令：', 'dim');
      ['  card       再看一次你的卡片',
       '  replay     再看一次開場動畫',
       '  ls         看看還有誰也有一張',
       '  contact    離職後怎麼找到我',
       '  uptime     我在這裡待了多久',
       '  whoami     ？',
       '  （還有一個沒寫在這，自己試）'].forEach(function(l){ print(l, 'dim'); });
      prompt();
    },
    card: function(){
      awaiting = false;
      if(window.__card) showCard(window.__card, {quiet:true});
      else { print(''); print('沒有可以重播的卡片。','dim'); prompt(); }
    },
    replay: function(){
      then(function(){
        playIntro({ skippable:true }).then(function(){ prompt(); });
      });
    },
    ls: function(){
      print('');
      print('$ ls farewell/', 'ps1');
      var me = (window.__card && window.__card.name || '').toLowerCase().replace(/[^a-z0-9]/g,'');
      var roster = (window.__card && window.__card.roster) || [];
      var w = Math.max.apply(null, roster.map(function(n){ return n.length; })) + 4;
      roster.forEach(function(n){
        var f = n.toLowerCase().replace(/[^a-z0-9]/g,'') + '.txt';
        var pad = f + Array(Math.max(1, w - f.length + 2)).join(' ');
        if(f.slice(0, -4) === me) print('  ' + pad + '← 你的', 'warn');
        else                      print('  ' + pad + '🔒', 'dim');
      });
      print('');
      print('  ' + roster.length + ' 個人，一人一張', 'dim');
      print('  你只打得開自己那一張', 'dim');
      prompt();
    },
    uptime: function(){
      // 到職 2026-01-05，最後一天 2026-11-06
      var a = new Date(2026, 0, 5), b = new Date(2026, 10, 6);
      var days = Math.round((b - a) / 86400000);
      var months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth())
                 - (b.getDate() < a.getDate() ? 1 : 0);
      var rem = b.getDate() - a.getDate();
      print('');
      print('$ uptime', 'ps1');
      print('  up ' + months + ' months, ' + rem + ' day', 'warn');
      print('  (' + days + ' days)', 'warn');
      print('');
      print('  since      2026-01-05', 'dim');
      print('  last login 2026-11-06', 'dim');
      print('  projects   誠品 國泰 糖蛙', 'dim');
      print('             集保 台達', 'dim');
      print('  regrets    0', 'dim');
      print('  status     涅槃重生', 'warn');
      prompt();
    },
    contact: function(){
      print('');
      print('$ contact amelie', 'ps1');
      print('');
      print('  離職之後還找得到我的地方：', 'warn');
      print('');
      print('  instagram', 'dim');
      link('    @amelielee0616', 'https://www.instagram.com/amelielee0616/');
      print('');
      print('  （這台機器會一直開著，想再看卡片隨時回來。）', 'dim');
      prompt();
    },
    whoami: function(){
      print('');
      reveal('我是 amelie 你不知道嗎 😎', 'warn', 200);
      prompt();
    },
    sudo: function(){
      print('');
      print('amelie is not in the sudoers file.', 'err');
      print('This incident has been reported.（報給誰？我已經離職了。）', 'err');
      prompt();
    }
  };

  function handle(raw){
    var input = String(raw).trim();
    if(!input) return prompt();
    var head = input.split(/\s+/)[0].toLowerCase();
    if(COMMANDS[head]) return COMMANDS[head](input);
    // 打自己的名字＝打開卡片（最直覺會試的動作）
    var norm = function(x){ return String(x).toLowerCase().replace(/[^a-z0-9]/g,''); };
    if(window.__card && norm(input) === norm(window.__card.name)) return COMMANDS.card();
    print('');
    print('command not found: ' + head, 'err');
    print('輸入 help 看看有什麼。', 'dim');
    prompt();
  }

  var awaiting = false;        // 還在等對方輸入 card

  /* ================= 輸入列 ================= */
  function prompt(){
    then(function(){
      line.classList.remove('hide');
      line.classList.toggle('await', awaiting);
      hint.hidden = false;
      hint.innerHTML = awaiting
        ? '點一下上面那行，打 <kbd>card</kbd> 再按 Enter'
        : '想再看一次輸入 <kbd>card</kbd>，想玩輸入 <kbd>help</kbd>。';
      cmd.value = '';
      cmd.placeholder = 'card';
      if(awaiting) try { cmd.focus(); } catch(_){}
      setTimeout(scroll, 0);
    });
  }
  cmd.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(running) return doSkip();
    holdTop = false;
    var v = cmd.value;
    print('');
    print('amelie@cloudmile:~$ ' + v, 'ps1');
    line.classList.add('hide'); hint.hidden = true; cmd.blur();
    handle(v);
  });
  // 點畫面＝跳過動畫；但「聚焦輸入框」只在點輸入列本身時才做
  // （手機上隨便點就彈鍵盤會蓋住剛讀到的卡片）
  document.addEventListener('click', function(e){
    if(running) doSkip();
  });
  line.addEventListener('click', function(){ cmd.focus(); });
  hint.addEventListener('click', function(){ cmd.focus(); });


  /* ================= 像素過場 ================= */
  function playIntro(opts){
    opts = opts || {};
    var cv = document.getElementById('px');
    var pxhint = document.getElementById('pxhint');
    if(reduce || !cv || !cv.getContext || !global_PixelIntro()){
      return Promise.resolve();
    }
    var PI = global_PixelIntro();
    var ctx2d = cv.getContext('2d', { alpha:false });

    // 低解析度內部畫布 → CSS 放大成大顆像素
    var W = 132;
    var H = Math.max(120, Math.min(300, Math.round(W * (innerHeight / innerWidth))));
    cv.width = W; cv.height = H;
    var img = ctx2d.createImageData(W, H);
    // 轉向或視窗改變時重算畫布，否則像素會被拉歪
    function resize(){
      var nh = Math.max(120, Math.min(300, Math.round(W * (innerHeight / innerWidth))));
      if(nh === H) return;
      H = nh; cv.width = W; cv.height = H;
      img = ctx2d.createImageData(W, H);
    }
    addEventListener('resize', resize);

    cv.style.opacity = '1';            // 重播時要把上次淡出的狀態清掉
    cv.classList.add('on');            // 第一次不給跳過 —— 這是整張卡的一部分
    if(opts.skippable){
      pxhint.classList.add('on');
      setTimeout(function(){ document.addEventListener('pointerdown', onTapSkip, true); }, 400);
    }

    // 時間軸（毫秒）：掃描線拉開 → 撥雲見日 → 滿版字幕 → 碎解
    var T_WIPE = 1100, T_SUN = 2200, T_TITLE = 3450, T_BREAK = 1000, T_FADE = 380;
    var TOTAL = T_WIPE + T_SUN + T_TITLE + T_BREAK;

    // 滿版像素字幕：直接畫進低解析畫布，與場景共用像素網格
    var TITLES = ['撥雲見日..', '豔陽高照', '萬里無雲', '珍重再見'];
    var curTitle = '', beatAt = 0;
    function beat(i, now){
      var next = (i < 0 || i >= TITLES.length) ? '' : TITLES[i];
      if (next === curTitle) return;
      curTitle = next; beatAt = now;
    }

    var onTapSkip = null;
    return new Promise(function(resolve){
      var start = performance.now(), done = false, raf = 0;
      onTapSkip = function(){ finish(); };

      function finish(){
        if(done) return; done = true;
        cancelAnimationFrame(raf);
        removeEventListener('resize', resize);
        if(onTapSkip) document.removeEventListener('pointerdown', onTapSkip, true);
        pxhint.classList.remove('on');
        cv.style.opacity = '0';
        setTimeout(function(){ cv.classList.remove('on'); resolve(); }, T_FADE);
      }
      function frame(now){
        var e = now - start;
        var p = { t:0, reveal:0, dissolve:0, tint:0, collapse:0, anim:e, climb:0 };
        if(e < T_WIPE){
          var w = e / T_WIPE;
          p.reveal = w * w * (3 - 2 * w);           // smoothstep，像掃描線拉下來
          p.t = 0.18 * w;
        } else if(e < T_WIPE + T_SUN){
          var s = (e - T_WIPE) / T_SUN;
          p.reveal = 1; p.t = 0.18 + 0.82 * s;
          p.climb = 0.45 * s;
          if (s > 0.42) beat(0, e);                 // 雲裂開的瞬間 →「撥雲見日..」
        } else if(e < T_WIPE + T_SUN + T_TITLE){
          // 畫面定格在豔陽，字幕一句一句打出來；小人繼續往峰頂爬
          p.reveal = 1; p.t = 1;
          p.climb = 0.45 + 0.55 * ((e - T_WIPE - T_SUN) / T_TITLE);
          beat(Math.min(TITLES.length - 1,
                        1 + Math.floor((e - T_WIPE - T_SUN) / (T_TITLE / 3))), e);
        } else {
          var b2 = Math.min(1, (e - T_WIPE - T_SUN - T_TITLE) / T_BREAK);
          p.reveal = 1; p.t = 1; p.climb = 1;
          p.dissolve = Math.min(1, b2 * 1.6);
          p.tint = Math.min(1, b2 * 1.25);
          p.collapse = Math.max(0, (b2 - 0.38) / 0.62);   // CRT 關機收合
          if(b2 > 0.05) beat(-1, e);
        }
        PI.renderFrame(img, W, H, p);
        // 換句時空 110ms 不畫 → 像素機台那種「啪」地跳字
        if (curTitle && (e - beatAt) > 170) PI.drawTitle(img, W, H, curTitle, p.tint);
        ctx2d.putImageData(img, 0, 0);
        if(e >= TOTAL) return finish();
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    });
  }
  function global_PixelIntro(){
    return (typeof PixelIntro !== 'undefined') ? PixelIntro : null;
  }

  /* ================= 開機 ================= */
  var token = (location.hash || '').replace(/^#/, '').trim();

  function boot(card){
    reveal('$ ssh amelie@cloudmile --final', 'ps1', 300);
    print('Authenticating with card key… ok', 'dim'); wait(160);
    print('Mounting /farewell … ok', 'dim'); wait(300);
    print('');
    reveal('嗨嗨，今天我就要離職了～', '', 520);            // 人話：整句出現
    reveal('為感謝你在這段時間的協助，我寫了卡片給你', '', 700);
    print('');
    reveal('for:', 'ps1', 360);
    reveal(card.name || 'unknown', 'to', 820);
    print('');
    reveal('你的卡片已經在這台機器上了。', 'warn', 420);
    reveal('輸入 card 打開它。', 'warn', 260);
    awaiting = true;
    prompt();
  }

  (async function start(){
    // 過場動畫與抓取解密同時進行 —— 動畫剛好蓋住真實等待時間
    var pending = (async function(){
      if(!token) return { kind:'nokey' };
      try {
        var data = await loadPayload();
        var card = await unlock(data, token);
        return card ? { kind:'ok', card:card } : { kind:'nokey' };
      } catch(err){
        console.error(err);
        return { kind:'offline' };            // 載不到 ≠ 不在名單
      }
    })();

    var results = await Promise.all([playIntro(), pending]);
    var r = results[1];

    if(r.kind === 'ok'){
      window.__card = r.card;
      return boot(r.card);
    }
    if(r.kind === 'offline'){
      reveal('$ ssh amelie@cloudmile --final', 'ps1', 300);
      print('Authenticating with card key… connection failed', 'err'); wait(420);
      print('');
      reveal('連不上伺服器，拿不到你的卡片。', 'warn', 420);
      reveal('不是你的連結有問題 —— 換個網路或重新整理再試一次。', 'warn', 260);
      print('');
      print('（如果一直都這樣，直接來跟我說。）', 'dim');
      return;
    }
    var fb = await getFallback();
    reveal('$ ssh amelie@cloudmile --final', 'ps1', 300);
    print('Authenticating with card key… failed', 'err'); wait(400);
    print('');
    then(function(){ showCard(fb, {quiet:true}); });
  })();
})();

</script>
